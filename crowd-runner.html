<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Crowd Runner</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#0d2437;}
  body{
    font-family:"Avenir Next","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    -webkit-user-select:none;user-select:none;touch-action:none;
  }
  #stage{position:relative;width:100%;height:100%;max-width:480px;overflow:hidden;}
  #stage canvas{display:block;width:100%!important;height:100%!important;}

  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  .lbl{
    position:absolute;transform:translate(-50%,-50%);
    white-space:nowrap;font-weight:800;line-height:1;will-change:left,top;
    max-width:33%;width:max-content;
  }

  /* 吹き出し型の人数バッジ */
  .badge{
    position:relative;display:flex;align-items:center;justify-content:center;
    width:max-content;min-width:1.95em;max-width:100%;height:1.75em;padding:0 .30em;
    overflow:hidden;
    border-radius:.52em;color:#fff;
    box-shadow:0 2px 6px rgba(10,50,80,.3);
  }
  .badge::after{
    content:"";position:absolute;left:50%;bottom:-.30em;
    transform:translateX(-50%);
    border-left:.30em solid transparent;border-right:.30em solid transparent;
    border-top:.36em solid;
  }
  .badge.ally{background:#1f8fdb;}
  .badge.ally::after{border-top-color:#1f8fdb;}
  .badge.foe{background:#db3527;}
  .badge.foe::after{border-top-color:#db3527;}

  /* ゲート上の演算表示 */
  .gatetext{
    color:#fff;
    text-shadow:-2px 0 rgba(13,58,86,.9), 2px 0 rgba(13,58,86,.9),
                0 -2px rgba(13,58,86,.9), 0 2px rgba(13,58,86,.9),
                0 5px 9px rgba(13,58,86,.35);
  }
  /* 通過時に浮き上がる大きな半透明の数字 */
  .pop{
    color:#fff;
    text-shadow:-3px 0 rgba(13,58,86,.7), 3px 0 rgba(13,58,86,.7),
                0 -3px rgba(13,58,86,.7), 0 3px rgba(13,58,86,.7);
  }

  /* 左上の先読みストリップ */
  #preview{
    position:absolute;top:14px;left:14px;
    display:flex;align-items:center;gap:9px;
    max-width:33%;overflow:hidden;
    background:rgba(24,122,190,.92);border-radius:13px;padding:6px 12px;
    box-shadow:0 2px 8px rgba(20,70,110,.18);
    opacity:0;transition:opacity .25s;
  }
  #preview .op{
    color:#fff;font-size:14px;font-weight:800;
    text-shadow:0 1px 2px rgba(6,40,62,.6);
  }
  #preview .sep{width:1px;height:13px;background:rgba(255,255,255,.5);}
  #preview .foe{
    background:#db3527;color:#fff;font-size:13px;font-weight:800;
    border-radius:7px;min-width:26px;padding:3px 6px;text-align:center;box-shadow:0 1px 3px rgba(120,30,25,.3);
  }

  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;text-align:center;
    background:rgba(10,36,55,.74);backdrop-filter:blur(6px);color:#fff;padding:28px;z-index:5;
  }
  .overlay.hidden{display:none;}
  .overlay h1{font-size:34px;font-weight:800;letter-spacing:-.02em;}
  .overlay h2{font-size:26px;font-weight:800;color:#ff8074;}
  .overlay p{font-size:14px;line-height:1.8;opacity:.85;max-width:340px;}
  .keys{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .key{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);
       border-radius:9px;padding:9px 15px;font-size:13px;font-weight:600;}
  .final{font-size:15px;opacity:.9;}
  .final b{font-size:30px;display:block;color:#ffc93c;font-variant-numeric:tabular-nums;}
  .cta{
    margin-top:4px;pointer-events:auto;cursor:pointer;background:#fff;color:#123a5c;
    border:none;border-radius:999px;padding:14px 34px;font-size:16px;font-weight:800;
    font-family:inherit;box-shadow:0 6px 20px rgba(0,0,0,.3);transition:transform .12s;
  }
  .cta:active{transform:scale(.96);}
</style>
</head>
<body>
<div id="stage">
  <div id="labels"></div>
  <div id="preview"></div>

  <div class="overlay" id="titleScreen">
    <h1>Crowd Runner</h1>
    <p>左右のゲートを選んで仲間を増やす。<br>敵にぶつかると <b>味方 − 敵</b> が残る数。0 以下で全滅。</p>
    <div class="keys">
      <span class="key">← →  移動</span>
      <span class="key">Space  開始</span>
      <span class="key">M  消音</span>
    </div>
    <button class="cta" id="startBtn">スタート</button>
  </div>

  <div class="overlay hidden" id="overScreen">
    <h2>全滅</h2>
    <div class="final">Score<b id="finalScore">0</b></div>
    <p id="overDetail"></p>
    <button class="cta" id="retryBtn">もう一度</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";

const stage  = document.getElementById("stage");
const labelL = document.getElementById("labels");
const prevEl = document.getElementById("preview");

/* ================= 定数 ================= */
const ROAD_HALF   = 6.4;
const LANE_LIMIT  = 0.92;
const X_SCALE     = 5.1;
const Z_SPAWN     = 96;
const START_COUNT = 10;
const MAX_ALLY    = 130;
const MAX_FOE     = 240;
const LEADER_Z    = -1.5;
const LEADER_K    = 1.16;

/* ================= three.js ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8ccfef);
scene.fog = new THREE.Fog(0x8ccfef, 62, 120);

const camera = new THREE.PerspectiveCamera(54, 1, 0.1, 240);
const CAM_Y = 13.2, CAM_Z = 10.4;
camera.position.set(0, CAM_Y, CAM_Z);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
stage.insertBefore(renderer.domElement, labelL);

let W = 0, H = 0;
function resize(){
  W = stage.clientWidth; H = stage.clientHeight;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H, false);
}
window.addEventListener("resize", resize);

scene.add(new THREE.AmbientLight(0xffffff, 0.78));
scene.add(new THREE.HemisphereLight(0xffffff, 0xa8cfe8, 0.5));
const sun = new THREE.DirectionalLight(0xffffff, 0.5);
sun.position.set(-8, 18, 10);
scene.add(sun);

/* ---- 氷原（道の下に広がる面） ---- */
const field = new THREE.Mesh(
  new THREE.PlaneGeometry(220, 340),
  new THREE.MeshLambertMaterial({ color: 0x4fa9d8 })
);
field.rotation.x = -Math.PI / 2;
field.position.set(0, -0.65, -140);
scene.add(field);

/* ---- 道 ---- */
const stripeCv = document.createElement("canvas");
stripeCv.width = 4; stripeCv.height = 64;
{
  const c = stripeCv.getContext("2d");
  c.fillStyle = "#ffffff"; c.fillRect(0, 0, 4, 64);
  c.fillStyle = "#e8f4fc"; c.fillRect(0, 0, 4, 31);
  c.fillStyle = "#c2dff2"; c.fillRect(0, 30, 4, 2);
}
const stripeTex = new THREE.CanvasTexture(stripeCv);
stripeTex.wrapS = stripeTex.wrapT = THREE.RepeatWrapping;
stripeTex.repeat.set(1, 34);

const road = new THREE.Mesh(
  new THREE.BoxGeometry(ROAD_HALF * 2, 0.7, 320),
  [
    new THREE.MeshLambertMaterial({ color: 0xa4d6ef }),
    new THREE.MeshLambertMaterial({ color: 0xa4d6ef }),
    new THREE.MeshLambertMaterial({ map: stripeTex }),
    new THREE.MeshLambertMaterial({ color: 0x7ab9dd }),
    new THREE.MeshLambertMaterial({ color: 0xa4d6ef }),
    new THREE.MeshLambertMaterial({ color: 0xa4d6ef })
  ]
);
road.position.set(0, -0.35, -136);
scene.add(road);

/* ---- 両脇の氷壁 ---- */
const ices = new THREE.InstancedMesh(
  new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshLambertMaterial({ color: 0x74c1e8 }),
  64
);
scene.add(ices);
const iceData = [];
for (let i = 0; i < 64; i++){
  const side = i % 2 ? 1 : -1;
  iceData.push({
    x: side * (ROAD_HALF + 1.4 + Math.random() * 7),
    z: -(i / 2) * 9 - Math.random() * 6,
    sx: 2.2 + Math.random() * 3.4,
    sy: 2.0 + Math.random() * 6.5,
    sz: 2.2 + Math.random() * 3.4,
    ry: Math.random() * Math.PI,
    rz: (Math.random() - 0.5) * 0.25
  });
}

/* ---- キャラのジオメトリ ---- */
const gHead = new THREE.SphereGeometry(0.25, 10, 8);
const gBody = new THREE.CylinderGeometry(0.27, 0.32, 0.66, 9);
const gArm  = new THREE.CylinderGeometry(0.085, 0.075, 0.46, 6);
const gLeg  = new THREE.CylinderGeometry(0.105, 0.09, 0.48, 6);
gArm.translate(0, -0.23, 0);
gLeg.translate(0, -0.24, 0);

/* 法線方向に膨らませた輪郭用ジオメトリ */
function outlineGeo(geo, d){
  const g = geo.clone();
  const pos = g.attributes.position, nor = g.attributes.normal;
  for (let i = 0; i < pos.count; i++){
    pos.setXYZ(i,
      pos.getX(i) + nor.getX(i) * d,
      pos.getY(i) + nor.getY(i) * d,
      pos.getZ(i) + nor.getZ(i) * d);
  }
  pos.needsUpdate = true;
  return g;
}
const OUT_D = 0.034;
const oHead = outlineGeo(gHead, OUT_D);
const oBody = outlineGeo(gBody, OUT_D);
const oArm  = outlineGeo(gArm,  OUT_D);
const oLeg  = outlineGeo(gLeg,  OUT_D);
const OUTLINE_MAT = new THREE.MeshBasicMaterial({ color:0x123247, side:THREE.BackSide });

function charMat(hex){
  const c = new THREE.Color(hex);
  return new THREE.MeshLambertMaterial({ color:c, emissive:c.clone().multiplyScalar(0.16) });
}
function makeSet(hex, max){
  const mat = charMat(hex);
  const mk = (geo, m, n, order) => {
    const im = new THREE.InstancedMesh(geo, m, n);
    im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    im.frustumCulled = false;
    im.renderOrder = order;
    scene.add(im);
    return im;
  };
  return {
    head:mk(gHead, mat, max, 1), body:mk(gBody, mat, max, 1),
    arm: mk(gArm,  mat, max*2, 1), leg: mk(gLeg,  mat, max*2, 1),
    oHead:mk(oHead, OUTLINE_MAT, max, 0), oBody:mk(oBody, OUTLINE_MAT, max, 0),
    oArm: mk(oArm,  OUTLINE_MAT, max*2, 0), oLeg: mk(oLeg,  OUTLINE_MAT, max*2, 0),
    i:{ head:0, body:0, arm:0, leg:0 }
  };
}
const SET = {
  ally:  makeSet(0x1f8fdb, MAX_ALLY),
  ally2: makeSet(0x3aa9ef, MAX_ALLY),
  foe:   makeSet(0xdb3527, MAX_FOE),
  foe2:  makeSet(0xf04a3a, MAX_FOE)
};

/* ---- 隊長 ---- */
const leadMat = charMat(0x1478c4);
const leader = new THREE.Group();
const lBody = new THREE.Mesh(gBody, leadMat);
const lHead = new THREE.Mesh(gHead, leadMat);
const lArms = [new THREE.Mesh(gArm, leadMat), new THREE.Mesh(gArm, leadMat)];
const lLegs = [new THREE.Mesh(gLeg, leadMat), new THREE.Mesh(gLeg, leadMat)];
lBody.add(new THREE.Mesh(oBody, OUTLINE_MAT));
lHead.add(new THREE.Mesh(oHead, OUTLINE_MAT));
for (const a of lArms) a.add(new THREE.Mesh(oArm, OUTLINE_MAT));
for (const l of lLegs) l.add(new THREE.Mesh(oLeg, OUTLINE_MAT));
lBody.position.y = 0.78; lHead.position.set(0, 1.32, -0.04);
lArms[0].position.set(-0.34, 1.02, 0); lArms[1].position.set(0.34, 1.02, 0);
lLegs[0].position.set(-0.15, 0.52, 0); lLegs[1].position.set(0.15, 0.52, 0);
leader.add(lBody, lHead, lArms[0], lArms[1], lLegs[0], lLegs[1]);
leader.scale.setScalar(LEADER_K);
leader.position.z = LEADER_Z;
scene.add(leader);

/* ---- 接地影 ---- */
const gShadow = new THREE.CircleGeometry(0.3, 10);
gShadow.rotateX(-Math.PI / 2);
const mShadow = new THREE.InstancedMesh(
  gShadow,
  new THREE.MeshBasicMaterial({ color:0x0f3d5c, transparent:true, opacity:0.20, depthWrite:false }),
  MAX_ALLY + MAX_FOE + 4
);
mShadow.frustumCulled = false;
scene.add(mShadow);

/* ---- 破片 ---- */
const mDot = new THREE.InstancedMesh(new THREE.SphereGeometry(0.18, 6, 5), charMat(0xdb3527), 70);
mDot.frustumCulled = false;
scene.add(mDot);

/* ---- ゲート ---- */
const gatePanelGeo = new THREE.BoxGeometry(ROAD_HALF, 2.2, 0.22);
const MAT_GATE = new THREE.MeshBasicMaterial({ color:0x2fb0ee, transparent:true, opacity:0.44, depthWrite:false });
const gatePostGeo = new THREE.CylinderGeometry(0.19, 0.19, 3.1, 10);
const gatePostMat = new THREE.MeshLambertMaterial({ color:0x18384e });
const gatePool = [];
function acquireGate(){
  if (gatePool.length) return gatePool.pop();
  const g = new THREE.Group();
  for (const sx of [-1, 1]){
    const p = new THREE.Mesh(gatePanelGeo, MAT_GATE);
    p.position.set(sx * ROAD_HALF / 2, 1.2, 0);
    g.add(p);
  }
  for (const px of [-ROAD_HALF, 0, ROAD_HALF]){
    const post = new THREE.Mesh(gatePostGeo, gatePostMat);
    post.position.set(px, 1.3, 0);
    g.add(post);
  }
  return g;
}
function releaseGate(g){ scene.remove(g); gatePool.push(g); }

/* ================= サウンド ================= */
let audio = null, muted = false;
function beep(freq, dur, type, vol){
  if (muted) return;
  try{
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.07, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + dur);
  }catch(e){}
}

/* ================= ロジック ================= */
const G = {
  running:false, over:false,
  count:START_COUNT, score:0, combo:0, best:0, killed:0,
  playerX:0, targetX:0, speed:15, travelled:0, time:0,
  objects:[], pops:[], dots:[],
  gapLeft:0, expected:START_COUNT, spawnKind:0, shake:0
};

function reset(){
  for (const o of G.objects) if (o.mesh) releaseGate(o.mesh);
  Object.assign(G, {
    running:true, over:false,
    count:START_COUNT, score:0, combo:0, killed:0,
    playerX:0, targetX:0, speed:15, travelled:0,
    objects:[], pops:[], dots:[],
    gapLeft:30, expected:START_COUNT, spawnKind:0, shake:0
  });
}

function makeOp(base, favorable){
  const r = Math.random();
  if (favorable){
    if (r < 0.42) return { kind:"mul", v: 2 + Math.floor(Math.random() * 2) };
    return { kind:"add", v: Math.max(5, Math.round(base * (0.35 + Math.random() * 0.6) / 5) * 5) };
  }
  if (r < 0.35) return { kind:"div", v: 2 };
  if (r < 0.60) return { kind:"sub", v: Math.max(5, Math.round(base * (0.25 + Math.random() * 0.3) / 5) * 5) };
  return { kind:"add", v: Math.max(2, Math.round(base * 0.08)) };
}
function applyOp(n, op){
  if (op.kind === "add") return n + op.v;
  if (op.kind === "sub") return Math.max(0, n - op.v);
  if (op.kind === "mul") return n * op.v;
  return Math.floor(n / op.v);
}
const opLabel = (op) => ({ add:"+", sub:"−", mul:"×", div:"÷" }[op.kind] + op.v);

function spawnGate(){
  const base = G.expected;
  const roll = Math.random();
  let l, r;
  if (roll < 0.12)      { l = makeOp(base, true);  r = makeOp(base, true); }
  else if (roll < 0.22) { l = makeOp(base, false); r = makeOp(base, false); }
  else if (Math.random() < 0.5) { l = makeOp(base, true);  r = makeOp(base, false); }
  else                          { l = makeOp(base, false); r = makeOp(base, true); }
  const mesh = acquireGate();
  scene.add(mesh);
  G.objects.push({ type:"gate", z:Z_SPAWN, left:l, right:r, done:false, mesh });
  G.expected = Math.max(3, Math.max(applyOp(base, l), applyOp(base, r)));
}
function spawnEnemy(){
  const n = Math.max(4, Math.round(G.expected * (0.34 + Math.random() * 0.34)));
  G.objects.push({ type:"enemy", z:Z_SPAWN, count:n, done:false, seed:Math.random() * 100 });
  G.expected = Math.max(3, G.expected - n);
}
function spawnNext(){
  const cycle = G.travelled < 240 ? ["gate","gate","gate","enemy"] : ["gate","gate","enemy"];
  const kind = cycle[G.spawnKind++ % cycle.length];
  if (kind === "gate"){ spawnGate();  G.gapLeft = 34 + Math.random() * 10; }
  else                { spawnEnemy(); G.gapLeft = 40 + Math.random() * 10; }
}

function popText(text, wx, wy, wz){ G.pops.push({ text, wx, wy, wz, life:1 }); }
function burst(wx, wz){
  for (let i = 0; i < 30; i++){
    G.dots.push({
      x:wx + (Math.random() - 0.5) * 3, y:0.8 + Math.random(), z:wz + (Math.random() - 0.5) * 2,
      vx:(Math.random() - 0.5) * 7, vy:3 + Math.random() * 6, vz:(Math.random() - 0.3) * 7, life:1
    });
  }
}

function gameOver(reason){
  G.running = false; G.over = true;
  document.getElementById("finalScore").textContent = Math.floor(G.score).toLocaleString();
  document.getElementById("overDetail").textContent =
    `${reason}／倒した群れ ${G.killed}・最大コンボ ${G.best}`;
  document.getElementById("overScreen").classList.remove("hidden");
}

function update(dt){
  G.time += dt;
  for (const b of iceData){
    b.z += (G.running ? G.speed : 4) * dt;
    if (b.z > 16) b.z -= 288;
  }
  if (G.running) stripeTex.offset.y = -G.travelled / 9.4;
  if (!G.running) return;

  G.speed = Math.min(32, 15 + G.travelled * 0.010);
  const dz = G.speed * dt;
  G.travelled += dz;
  G.score += dz * 0.6;

  const move = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
  if (move !== 0) G.targetX = Math.max(-LANE_LIMIT, Math.min(LANE_LIMIT, G.targetX + move * 2.1 * dt));
  G.playerX += (G.targetX - G.playerX) * Math.min(1, dt * 12);

  for (const o of G.objects){
    o.z -= dz;
    if (o.done) continue;

    if (o.type === "gate" && o.z <= 1.0){
      o.done = true;
      const op = G.playerX < 0 ? o.left : o.right;
      const before = G.count;
      G.count = Math.max(0, applyOp(G.count, op));
      popText(opLabel(op), G.playerX * X_SCALE, 3.0, -2.2);
      beep(G.count >= before ? 660 : 220, 0.12, "triangle", 0.06);
      if (G.count <= 0) return gameOver("ゲートで仲間を失った");
    }

    if (o.type === "enemy" && o.z <= 2.2){
      o.done = true;
      const before = G.count;
      G.count = before - o.count;
      G.shake = 1;
      burst(0, -2.2);
      if (G.count <= 0){
        G.count = 0;
        beep(110, 0.5, "sawtooth", 0.1);
        return gameOver(`敵 ${o.count} に対して味方 ${before}`);
      }
      G.killed++; G.combo++;
      G.best = Math.max(G.best, G.combo);
      G.score += o.count * 12 * Math.min(5, G.combo);
      beep(520, 0.16, "square", 0.07);
    }
  }

  for (const o of G.objects) if (o.z <= -18 && o.mesh){ releaseGate(o.mesh); o.mesh = null; }
  G.objects = G.objects.filter(o => o.z > -18);

  G.gapLeft -= dz;
  if (G.gapLeft <= 0) spawnNext();

  for (const p of G.pops){ p.life -= dt * 0.95; p.wy += dt * 2.4; p.wz += dz * 0.35; }
  G.pops = G.pops.filter(p => p.life > 0);

  for (const d of G.dots){
    d.life -= dt * 1.3;
    d.vy -= 16 * dt;
    d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt + dz;
    if (d.y < 0.1){ d.y = 0.1; d.vy *= -0.35; }
  }
  G.dots = G.dots.filter(d => d.life > 0);

  G.shake = Math.max(0, G.shake - dt * 3.5);
}

/* ================= 描画 ================= */
const dummy = new THREE.Object3D();
dummy.rotation.order = "YXZ";
let iShadow = 0;

function pushChar(set, x, z, phase, facing){
  const idx = set.i;
  if (idx.head >= set.head.instanceMatrix.count) return;
  const swing = Math.sin(phase);
  const bob   = Math.abs(Math.cos(phase)) * 0.11;
  const lean  = facing === 0 ? -0.12 : 0.12;

  dummy.position.set(x, 0.78 + bob, z);
  dummy.rotation.set(lean, facing, 0);
  dummy.updateMatrix();
  set.body.setMatrixAt(idx.body++, dummy.matrix);

  dummy.position.set(x, 1.32 + bob, z + Math.sin(lean) * 0.35);
  dummy.rotation.set(0, facing, 0);
  dummy.updateMatrix();
  set.head.setMatrixAt(idx.head++, dummy.matrix);

  for (let s = 0; s < 2; s++){
    const sign = s ? 1 : -1;
    dummy.position.set(x + sign * 0.34, 1.02 + bob, z);
    dummy.rotation.set(swing * sign * -1.05, facing, sign * 0.12);
    dummy.updateMatrix();
    set.arm.setMatrixAt(idx.arm++, dummy.matrix);
  }
  for (let s = 0; s < 2; s++){
    const sign = s ? 1 : -1;
    dummy.position.set(x + sign * 0.15, 0.52 + bob, z);
    dummy.rotation.set(swing * sign * 1.15, facing, 0);
    dummy.updateMatrix();
    set.leg.setMatrixAt(idx.leg++, dummy.matrix);
  }

  if (iShadow < mShadow.instanceMatrix.count){
    dummy.position.set(x, 0.02, z);
    dummy.rotation.set(0, 0, 0);
    const sc = 1 - bob * 0.9;
    dummy.scale.set(sc, 1, sc);
    dummy.updateMatrix();
    mShadow.setMatrixAt(iShadow++, dummy.matrix);
    dummy.scale.set(1, 1, 1);
  }
}

// 味方：隊長の後ろに広がる楔形
function pushAllies(n, cx){
  let i = 0, row = 0;
  while (i < n){
    const w = Math.min(15, 3 + row * 2);
    for (let c = 0; c < w && i < n; c++, i++){
      const jx = (Math.sin(i * 12.9898) % 1) * 0.12;
      const jz = (Math.sin(i * 78.233) % 1) * 0.12;
      pushChar(i % 3 === 0 ? SET.ally2 : SET.ally,
               cx + (c - (w - 1) / 2) * 0.46 + jx,
               row * 0.46 + jz,
               G.time * 13 + i * 0.7, 0);
    }
    row++;
  }
}

// 敵：密集した長方形
function pushFoes(n, cz, seed){
  const cols = 14;
  for (let i = 0; i < n; i++){
    const row = Math.floor(i / cols), col = i % cols;
    const jx = (Math.sin((i + seed) * 12.9898) % 1) * 0.1;
    const jz = (Math.sin((i + seed) * 78.233) % 1) * 0.1;
    pushChar(i % 3 === 0 ? SET.foe2 : SET.foe,
             ((col - (cols - 1) / 2) + (row % 2 ? 0.5 : 0)) * 0.44 + jx,
             cz - row * 0.44 + jz,
             G.time * 13 + i * 0.7 + seed, Math.PI);
  }
}

function updateLeader(x){
  const phase = G.time * 13;
  const swing = Math.sin(phase);
  const bob   = Math.abs(Math.cos(phase)) * 0.11;
  leader.position.set(x, bob * LEADER_K, LEADER_Z);
  lBody.rotation.x = -0.14;
  lArms[0].rotation.x = swing * 1.05;  lArms[1].rotation.x = -swing * 1.05;
  lArms[0].rotation.z = -0.12;         lArms[1].rotation.z = 0.12;
  lLegs[0].rotation.x = -swing * 1.15; lLegs[1].rotation.x = swing * 1.15;

  if (iShadow < mShadow.instanceMatrix.count){
    dummy.position.set(x, 0.02, LEADER_Z);
    dummy.rotation.set(0, 0, 0);
    dummy.scale.set(LEADER_K, 1, LEADER_K);
    dummy.updateMatrix();
    mShadow.setMatrixAt(iShadow++, dummy.matrix);
    dummy.scale.set(1, 1, 1);
  }
}

function renderScene(){
  iShadow = 0;
  for (const k in SET) SET[k].i = { head:0, body:0, arm:0, leg:0 };

  for (let i = 0; i < iceData.length; i++){
    const b = iceData[i];
    dummy.position.set(b.x, b.sy / 2 - 0.9, b.z);
    dummy.rotation.set(0, b.ry, b.rz);
    dummy.scale.set(b.sx, b.sy, b.sz);
    dummy.updateMatrix();
    ices.setMatrixAt(i, dummy.matrix);
  }
  ices.instanceMatrix.needsUpdate = true;
  dummy.scale.set(1, 1, 1);

  const px = G.playerX * X_SCALE;
  for (const o of G.objects) if (o.type === "gate" && o.mesh) o.mesh.position.z = -o.z;

  updateLeader(px);
  pushAllies(Math.min(Math.max(0, G.count - 1), MAX_ALLY - 1), px);
  for (const o of G.objects){
    if (o.type === "enemy" && !o.done) pushFoes(Math.min(o.count, MAX_FOE), -o.z, o.seed);
  }

  for (const k in SET){
    const s = SET[k];
    s.head.count = s.i.head; s.body.count = s.i.body;
    s.arm.count  = s.i.arm;  s.leg.count  = s.i.leg;
    s.head.instanceMatrix.needsUpdate = true;
    s.body.instanceMatrix.needsUpdate = true;
    s.arm.instanceMatrix.needsUpdate  = true;
    s.leg.instanceMatrix.needsUpdate  = true;
    // 輪郭は本体と同じ姿勢
    for (const [src, dst] of [[s.head, s.oHead], [s.body, s.oBody], [s.arm, s.oArm], [s.leg, s.oLeg]]){
      dst.instanceMatrix.array.set(src.instanceMatrix.array);
      dst.instanceMatrix.needsUpdate = true;
      dst.count = src.count;
    }
  }
  mShadow.count = iShadow;
  mShadow.instanceMatrix.needsUpdate = true;

  for (let i = 0; i < G.dots.length && i < 70; i++){
    const d = G.dots[i];
    dummy.position.set(d.x, d.y, d.z);
    dummy.rotation.set(0, 0, 0);
    const s = Math.max(0.05, d.life);
    dummy.scale.set(s, s, s);
    dummy.updateMatrix();
    mDot.setMatrixAt(i, dummy.matrix);
  }
  mDot.count = Math.min(G.dots.length, 70);
  mDot.instanceMatrix.needsUpdate = true;
  dummy.scale.set(1, 1, 1);

  const shake = G.shake * 0.3;
  camera.position.x += ((px * 0.28) - camera.position.x) * 0.1;
  camera.position.y = CAM_Y + (Math.random() - 0.5) * shake;
  camera.position.z = CAM_Z + (Math.random() - 0.5) * shake;
  camera.lookAt(px * 0.16, 0.2, -23);

  renderer.render(scene, camera);
}

/* ---- ラベル ---- */
const labelPool = [];
const v3 = new THREE.Vector3();
function project(x, y, z){
  v3.set(x, y, z).project(camera);
  return { x:(v3.x * 0.5 + 0.5) * W, y:(-v3.y * 0.5 + 0.5) * H, ok: v3.z < 1 };
}
function useLabel(i){
  if (!labelPool[i]){
    const el = document.createElement("div");
    el.className = "lbl";
    labelL.appendChild(el);
    labelPool[i] = el;
  }
  return labelPool[i];
}
function place(el, x, y, size, opacity){
  el.style.left = x + "px"; el.style.top = y + "px";
  el.style.fontSize = size + "px"; el.style.opacity = opacity;
  el.style.display = "block";
}

function renderLabels(){
  let n = 0;
  const px = G.playerX * X_SCALE;
  const sizeAt    = (z) => Math.max(11, Math.min(30, 720  / Math.max(11, camera.position.z - z + 4)));
  const foeSizeAt = (z) => Math.max(15, Math.min(40, 1000 / Math.max(11, camera.position.z - z + 4)));

  if (G.running || G.over){
    const p = project(px, 3.2, LEADER_Z);
    if (p.ok){
      const el = useLabel(n++);
      el.className = "lbl badge ally";
      el.textContent = G.count;
      place(el, p.x, p.y, 32, 1);
    }
  }

  for (const o of G.objects){
    if (o.done) continue;
    const wz = -o.z;
    if (o.type === "gate"){
      const s = sizeAt(wz);
      for (const side of [-1, 1]){
        const p = project(side * ROAD_HALF / 2, 1.35, wz);
        if (!p.ok) continue;
        const el = useLabel(n++);
        el.className = "lbl gatetext";
        el.textContent = opLabel(side < 0 ? o.left : o.right);
        place(el, p.x, p.y, s * 1.25, 1);
      }
    } else {
      const p = project(0, 2.7, wz);
      if (!p.ok) continue;
      const el = useLabel(n++);
      el.className = "lbl badge foe";
      el.textContent = o.count;
      place(el, p.x, p.y, foeSizeAt(wz), 1);
    }
  }

  for (const pp of G.pops){
    const p = project(pp.wx, pp.wy, pp.wz);
    if (!p.ok) continue;
    const el = useLabel(n++);
    el.className = "lbl pop";
    el.textContent = pp.text;
    place(el, p.x, p.y, 46, Math.max(0, pp.life) * 0.72);
  }

  for (let i = n; i < labelPool.length; i++) labelPool[i].style.display = "none";
}

/* ---- 左上の先読みストリップ ---- */
let prevKey = "";
function renderPreview(){
  if (!G.running){ prevEl.style.opacity = "0"; return; }
  const up = G.objects.filter(o => !o.done && o.z > 0).sort((a, b) => a.z - b.z).slice(0, 2);
  const key = up.map(o => o.type === "gate" ? opLabel(o.left) + "/" + opLabel(o.right) : "e" + o.count).join(",");
  if (key === prevKey) return;
  prevKey = key;

  prevEl.innerHTML = "";
  up.forEach((o, i) => {
    if (i) prevEl.appendChild(Object.assign(document.createElement("div"), { className:"sep" }));
    const d = document.createElement("div");
    if (o.type === "gate"){
      d.className = "op";
      d.textContent = opLabel(o.left) + "  " + opLabel(o.right);
    } else {
      d.className = "foe";
      d.textContent = o.count;
    }
    prevEl.appendChild(d);
  });
  prevEl.style.opacity = "1";
}

/* ================= 入力 ================= */
const keys = { left:false, right:false };
window.addEventListener("keydown", (e) => {
  if (e.code === "ArrowLeft"  || e.code === "KeyA"){ keys.left = true;  e.preventDefault(); }
  if (e.code === "ArrowRight" || e.code === "KeyD"){ keys.right = true; e.preventDefault(); }
  if (e.code === "KeyM") muted = !muted;
  if (e.code === "Space" || e.code === "Enter"){ e.preventDefault(); if (!G.running) start(); }
});
window.addEventListener("keyup", (e) => {
  if (e.code === "ArrowLeft"  || e.code === "KeyA") keys.left = false;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
});
let dragging = false;
function pointerX(ev){
  const r = renderer.domElement.getBoundingClientRect();
  return Math.max(-LANE_LIMIT, Math.min(LANE_LIMIT, ((ev.clientX - r.left) / r.width - 0.5) * 2.1));
}
renderer.domElement.addEventListener("pointerdown", (e) => { dragging = true; G.targetX = pointerX(e); });
renderer.domElement.addEventListener("pointermove", (e) => { if (dragging) G.targetX = pointerX(e); });
window.addEventListener("pointerup", () => { dragging = false; });

/* ================= 起動 ================= */
function start(){
  document.getElementById("titleScreen").classList.add("hidden");
  document.getElementById("overScreen").classList.add("hidden");
  prevKey = "";
  reset();
}
document.getElementById("startBtn").addEventListener("click", start);
document.getElementById("retryBtn").addEventListener("click", start);

resize();
camera.lookAt(0, 0.2, -23);

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  renderScene();
  renderLabels();
  renderPreview();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ================= 強化学習用フック ================= */
window.CrowdRunner = {
  reset: start,
  step(action){ keys.left = action === 0; keys.right = action === 2; },
  getState(){
    const ahead = G.objects
      .filter(o => !o.done && o.z > 0)
      .sort((a, b) => a.z - b.z)
      .slice(0, 3)
      .map(o => o.type === "gate"
        ? { t:"gate", z:o.z,
            l:{ ...o.left,  result: applyOp(G.count, o.left)  },
            r:{ ...o.right, result: applyOp(G.count, o.right) } }
        : { t:"enemy", z:o.z, n:o.count });
    return { count:G.count, x:G.playerX, speed:G.speed, score:G.score, ahead, done:G.over };
  }
};

})();
</script>
